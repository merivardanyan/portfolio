<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <!--csp:start--><!--csp:end-->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#121212">
  <!-- GitHub Pages serves this file for any missing path; build-site.mjs writes the base from config.siteUrl. -->
  <!--base:start--><base href="/"><!--base:end-->
  <link rel="icon" href="assets/images/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="assets/images/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="assets/images/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
  <script>(function(){var d=document.documentElement,t;try{t=localStorage.getItem('theme')}catch(e){}if(t!=='light'&&t!=='dark')t=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';d.dataset.theme=t})()</script>
</head>
<body>
  <main class="container" style="min-height:100vh;display:grid;align-content:center;gap:1.5rem;padding-block:4rem">
    <p class="eyebrow">404</p>
    <h1 style="font-size:clamp(2.5rem,6vw,5rem)">This page doesn't exist.</h1>
    <p class="section__lede">The link may be old, or the demo you're after may have moved.</p>
    <p><a class="btn btn--primary btn--lg" href="./">Back to the portfolio</a></p>
  </main>
</body>
</html>
